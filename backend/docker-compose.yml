version: "3.8"

services:
  mongodb:
    image: mongo:7.0
    container_name: express-auth-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: express-auth
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - express-auth-network

  app:
    build: .
    container_name: express-auth-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    env_file:
      - .env
    depends_on:
      - mongodb
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - express-auth-network

volumes:
  mongodb_data:

networks:
  express-auth-network:
    driver: bridge
